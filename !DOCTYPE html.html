<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Test Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin: 0;
        }

        header {
            background: #0078D7;
            color: white;
            padding: 20px;
        }

        main {
            padding: 40px;
        }

        button {
            background: #0078D7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Website</h1>
</header>

<main>
    <h2>Hello!</h2>
    <p>This is my first test website.</p>

    <button onclick="showMessage()">Click Me</button>
</main>

<footer>
    &copy; 2026 My Test Website
</footer>

<script>
    function showMessage() {
        alert("Hello! Your website is working!");
    }
</script>

</body>
</html>
